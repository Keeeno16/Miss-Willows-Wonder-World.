<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Miss Willow's Wonder World · 3D Preview</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#d7f4ff;color:#21443b}header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#fffdf3}h1{font-size:clamp(16px,3vw,23px);margin:0}#scene{height:62dvh;min-height:310px;position:relative;background:linear-gradient(#a8eaff,#dcf7d6);overflow:hidden}canvas{display:block}#hud{position:absolute;left:12px;top:12px;background:#ffffffd9;border-radius:14px;padding:8px 12px;font-weight:700}#hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#ffffffeb;border-radius:16px;padding:9px 15px;white-space:nowrap;font-size:14px}#panel{padding:12px 16px;background:#fffef7;min-height:125px}button{background:#fff;border:2px solid #58a786;border-radius:14px;padding:10px 16px;font-size:18px;color:#204a3b;cursor:pointer;margin:3px}button:focus-visible{outline:3px solid #2556b7}.primary{background:#c7f4cc}#buttons{display:flex;flex-wrap:wrap;gap:6px;align-items:center}#pad{position:absolute;right:12px;bottom:52px;display:grid;grid-template-columns:repeat(3,45px);gap:3px}#pad button{padding:7px;margin:0;background:#ffffffbc;touch-action:none}#pad button:first-child{grid-column:2}#pad button:nth-child(2){grid-column:1;grid-row:2}#pad button:nth-child(3){grid-column:2;grid-row:2}#pad button:nth-child(4){grid-column:3;grid-row:2}.small{font-size:13px;color:#52766d}#status{font-weight:700}#fallback{display:none;padding:40px;text-align:center}@media(min-width:850px){#pad{opacity:.75}}</style></head><body><header><h1>🌿 Miss Willow's Wonder World</h1><span id="stars">⭐ 0</span></header><div id="scene"><div id="hud">3D exploration preview · v0.2</div><div id="hint">Walk toward the glowing animal circles</div><div id="pad"><button data-dir="up" aria-label="Forward">▲</button><button data-dir="left" aria-label="Left">◀</button><button data-dir="down" aria-label="Back">▼</button><button data-dir="right" aria-label="Right">▶</button></div><div id="fallback">3D graphics couldn't load. Check your connection and reload.</div></div><section id="panel"><div id="status">Choose an explorer to begin.</div><div id="buttons"><button onclick="choose(0)">👧🏽</button><button onclick="choose(1)">👦🏿</button><button onclick="choose(2)">👧🏻</button><button onclick="choose(3)">🧒</button></div><div id="feedback" class="small">Speech is used only for dialogue. Phoneme recordings will be added after teacher review.</div></section><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const root=document.getElementById('scene'),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(root.clientWidth,root.clientHeight);renderer.shadowMap.enabled=true;root.prepend(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color(0xb9edff);scene.fog=new THREE.Fog(0xb9edff,22,55);const camera=new THREE.PerspectiveCamera(55,root.clientWidth/root.clientHeight,.1,100);scene.add(new THREE.HemisphereLight(0xffffff,0x81b68b,2.3));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-6,12,8);scene.add(sun);const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85});function box(w,h,d,c,x,y,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);scene.add(m);return m}function ball(r,c,x,y,z){let m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat(c));m.position.set(x,y,z);scene.add(m);return m}box(42,.3,42,0x8dd37e,0,-.18,0);box(4,.04,27,0xf4d6a1,0,.01,0);function tree(x,z){box(.35,2,.35,0x926044,x,1,z);ball(1.25,0x52b96e,x,2.5,z);ball(.85,0x72d685,x-.6,2.9,z)}for(let z=-16;z<18;z+=5){tree(-5.5,z);tree(5.5,z)}function house(x,z,c){box(3,2.7,3,c,x,1.35,z);let roof=new THREE.Mesh(new THREE.ConeGeometry(2.7,1.6,4),mat(0xe78970));roof.rotation.y=Math.PI/4;roof.position.set(x,3.4,z);scene.add(roof);box(.8,1.5,.1,0x6e4c39,x,.75,z+1.56)}house(-9,-6,0xffd58c);house(9,-11,0xdab5f1);house(-9,8,0xffc2ca);function person(x,z,skin,shirt){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.7,4,10),mat(shirt));body.position.y=1;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.43,16,12),mat(skin));head.position.y=2;g.add(head);for(let a of [-.22,.22]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),mat(0x272727));eye.position.set(a,2.07,.38);g.add(eye)}scene.add(g);g.position.set(x,0,z);return g}const player=person(0,5,0x98684c,0x4b8fe1),willow=person(-2,-2,0x8e573c,0xe85a9b);ball(.52,0x25212a,-2,2.47,-2);const animals=[];function animal(x,z,color,label){let g=new THREE.Group();const b=new THREE.Mesh(new THREE.SphereGeometry(.6,16,12),mat(color));b.position.y=.7;g.add(b);for(let d of [-.32,.32]){let ear=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.6,4,8),mat(color));ear.position.set(d,1.48,0);g.add(ear)}let ring=new THREE.Mesh(new THREE.TorusGeometry(.95,.07,8,32),new THREE.MeshBasicMaterial({color:0xffd65c}));ring.rotation.x=-Math.PI/2;ring.position.y=.08;g.add(ring);g.position.set(x,0,z);scene.add(g);animals.push({g,label})}animal(3,-4,0xf4f2ed,'Bunny');animal(-3,-10,0x58c4cf,'Parrot');animal(3,-15,0xf5b364,'Fox');let stars=0,lesson=0,active=null;const lessons=[{prompt:'Which letter represents the /m/ sound?',options:['m','s','t'],answer:'m'},{prompt:'Which letter represents the /s/ sound?',options:['t','s','a'],answer:'s'},{prompt:'Which word is spelled m-a-t?',options:['mat','sat','map'],answer:'mat'}];const status=document.getElementById('status'),buttons=document.getElementById('buttons'),feedback=document.getElementById('feedback');function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.92;u.pitch=1.03;speechSynthesis.speak(u)}window.choose=n=>{let skins=[0x98684c,0x583b2b,0xe8b18d,0xb78365],shirts=[0xe97799,0x4a9be1,0xb38ce0,0x64b887];player.children[0].material=mat(shirts[n]);player.children[1].material=mat(skins[n]);status.textContent='Explore the village and help an animal!';buttons.innerHTML='<button class="primary" onclick="start()">Start a phonics activity</button>';speak('Welcome, explorer! I am Miss Willow. Let us help our animal friends!')};window.start=()=>{let q=lessons[lesson%lessons.length];active=q;status.textContent=q.prompt;buttons.innerHTML='';q.options.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>answer(v);buttons.appendChild(b)});feedback.textContent='Tap a choice. Audio for individual sounds is intentionally disabled until verified recordings are available.';speak('Look at the choices and choose your answer.')};function answer(v){if(v===active.answer){stars++;lesson++;document.getElementById('stars').textContent='⭐ '+stars;status.textContent='Great work! You helped an animal.';buttons.innerHTML='<button class="primary" onclick="start()">Next challenge</button>';feedback.textContent='Previously learned skills will return for practice.';speak('Wonderful work!')}else{feedback.textContent='Try again. Take your time.';speak('Good try! Look carefully and try again.')}}const keys={};window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[d]=true;b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[d]=false)});let prev=performance.now(),notified=false;function tick(now){requestAnimationFrame(tick);let dt=Math.min((now-prev)/1000,.05);prev=now;let dx=(keys.arrowright||keys.d||keys.right?1:0)-(keys.arrowleft||keys.a||keys.left?1:0),dz=(keys.arrowdown||keys.s||keys.down?1:0)-(keys.arrowup||keys.w||keys.up?1:0);player.position.x=THREE.MathUtils.clamp(player.position.x+dx*4*dt,-12,12);player.position.z=THREE.MathUtils.clamp(player.position.z+dz*4*dt,-18,15);camera.position.lerp(new THREE.Vector3(player.position.x+8,10,player.position.z+12),.065);camera.lookAt(player.position.x,1,player.position.z-3);let near=animals.some(a=>a.g.position.distanceTo(player.position)<2.6)||willow.position.distanceTo(player.position)<2.6;if(near&&!notified){document.getElementById('hint').textContent='You found a friend! Tap Start a phonics activity.';notified=true}else if(!near){notified=false;document.getElementById('hint').textContent='Walk toward the glowing animal circles'}animals.forEach(a=>a.g.rotation.y+=dt*.3);renderer.render(scene,camera)}requestAnimationFrame(tick);window.addEventListener('resize',()=>{camera.aspect=root.clientWidth/root.clientHeight;camera.updateProjectionMatrix();renderer.setSize(root.clientWidth,root.clientHeight)});
</script></body></html>
