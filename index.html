<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Miss Willow's Wonder World</title><style>body{margin:0;font-family:system-ui;background:#b9ecfa;color:#173c39}header{padding:12px;background:#fff9;border-bottom:3px solid #ffffff}h1{font-size:22px;margin:0}#game{height:58vh;min-height:300px;position:relative;overflow:hidden;background:linear-gradient(#a4e8ff 0 48%,#92d97e 48%);touch-action:none}.path{position:absolute;left:0;right:0;bottom:0;height:35%;background:#e9c58c;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}.person{position:absolute;font-size:48px;transform:translate(-50%,-50%);user-select:none}.npc{border:0;background:#fff9;border-radius:18px;padding:10px;font-size:17px;position:absolute;cursor:pointer}.npc:focus-visible,button:focus-visible{outline:4px solid #245fba}#player{left:50%;top:73%}#willow{left:25%;top:38%}#parrot{right:8%;top:28%}#rabbit{left:7%;top:67%}#panel{background:white;border-radius:18px;margin:12px;padding:16px;min-height:105px}button{cursor:pointer;font-size:18px;padding:12px;border-radius:12px;border:2px solid #367d5b;background:#f5fff2;color:#173c39;margin:3px}#controls{text-align:center}#controls button{min-width:65px}#choices button{min-width:70px}.muted{color:#41655c;font-size:14px}</style></head><body><header><h1>🌿 Miss Willow's Wonder World <span id="stars">⭐ 0</span></h1><div class="muted">Prototype 0.1 · Tap an animal to help!</div></header><main><div id="game"><div class="path"></div><div class="person" id="player">🧒</div><button class="npc" id="willow" onclick="talk('willow')">👩🏽‍🏫 Miss Willow</button><button class="npc" id="parrot" onclick="talk('parrot')">🦜 Parrot</button><button class="npc" id="rabbit" onclick="talk('rabbit')">🐇 Rabbit</button></div><div id="panel"><strong id="prompt">Welcome, explorer! Choose your character, then visit an animal.</strong><div id="choices"><button onclick="avatar('🧒')">🧒</button><button onclick="avatar('👧🏽')">👧🏽</button><button onclick="avatar('👦🏿')">👦🏿</button><button onclick="avatar('👧🏻')">👧🏻</button></div><div id="feedback" aria-live="polite"></div></div><div id="controls"><div><button aria-label="Move up" onclick="move(0,-1)">⬆️</button></div><button aria-label="Move left" onclick="move(-1,0)">⬅️</button><button aria-label="Move down" onclick="move(0,1)">⬇️</button><button aria-label="Move right" onclick="move(1,0)">➡️</button></div><p class="muted" style="text-align:center">Keyboard: arrow keys or WASD. Audio uses your device's voice when available.</p></main><script>let x=50,y=73,stars=0,step=0;const questions=[{spoken:"Listen: mmm, aaa, t. Which word do those sounds make?",answer:"mat",options:["mat","sun","dog"]},{spoken:"Listen: sss, aaa, t. Which word do those sounds make?",answer:"sat",options:["map","sat","pin"]},{spoken:"Which letter makes the mmm sound?",answer:"m",options:["s","m","t"]}];function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.78;speechSynthesis.speak(u)}}function avatar(v){document.getElementById('player').textContent=v;document.getElementById('prompt').textContent="Great! Explore and tap Miss Willow or an animal.";document.getElementById('choices').innerHTML='';speak("Welcome to Wonder World!")}function move(dx,dy){x=Math.max(5,Math.min(95,x+dx*5));y=Math.max(15,Math.min(90,y+dy*5));let p=document.getElementById('player');p.style.left=x+'%';p.style.top=y+'%'}document.addEventListener('keydown',e=>{let k=e.key.toLowerCase(),d={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];if(d){e.preventDefault();move(...d)}});function talk(who){let q=questions[step%questions.length];document.getElementById('prompt').textContent=(who==='willow'?'Miss Willow says: ':'Help the '+who+'! ')+q.spoken;document.getElementById('feedback').textContent='';document.getElementById('choices').innerHTML=q.options.map(v=>'<button onclick="answer(\''+v+'\')">'+v+'</button>').join('');speak(q.spoken)}function answer(v){let q=questions[step%questions.length];if(v===q.answer){stars++;step++;document.getElementById('stars').textContent='⭐ '+stars;document.getElementById('feedback').textContent='Wonderful! You earned a star. Visit another friend!';document.getElementById('choices').innerHTML='';speak('Wonderful! You earned a star!')}else{document.getElementById('feedback').textContent='Good try! Listen again and choose another answer.';speak('Good try. '+q.spoken)}}</script></body></html>
